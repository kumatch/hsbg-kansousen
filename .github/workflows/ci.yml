name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # hsbg reads logs written on Windows (paths, HDT folders); the tests are run there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Personal data check (built-in patterns; the deny list stays on each developer's PC)
        run: python scripts/check_private.py

  schema:
    # The log contract belongs to the recorder repository hsbg-kifu (moved there from the HDT plugin
    # hdt-plugin-hsbg-kansousen on 2026-11-21); hsbg keeps copies of its schema/game-log.schema.json
    # (hsbg/game-log.schema.json) and docs/log-schema.md. A difference means hsbg-kifu changed the log
    # format: copy both over and update the loader (hsbg-kifu's CLAUDE.md "ログの形を変えたとき").
    # Fails on a difference; a file that cannot be fetched (e.g. while hsbg-kifu is private or not
    # pushed yet) is only a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with hsbg-kifu's schema and log-schema.md
        run: |
          base=https://raw.githubusercontent.com/kumatch/hsbg-kifu/main
          if ! curl -fsSL -o kifu-schema.json "$base/schema/game-log.schema.json" \
             || ! curl -fsSL -o kifu-log-schema.md "$base/docs/log-schema.md"; then
            echo "::warning::could not fetch hsbg-kifu's log contract; not compared"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          failed = False
          ours = json.loads(Path("hsbg/game-log.schema.json").read_text(encoding="utf-8"))
          theirs = json.loads(Path("kifu-schema.json").read_text(encoding="utf-8"))
          if ours != theirs:
              print("::error::hsbg/game-log.schema.json differs from hsbg-kifu's schema/game-log.schema.json")
              failed = True
          def text(p):
              # line endings ignored (a checkout may convert them)
              return Path(p).read_text(encoding="utf-8").replace("\r\n", "\n")

          if text("docs/log-schema.md") != text("kifu-log-schema.md"):
              print("::error::docs/log-schema.md differs from hsbg-kifu's docs/log-schema.md")
              failed = True
          if failed:
              raise SystemExit(1)
          print("log contract copies are up to date")
          PY
